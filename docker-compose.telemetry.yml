# Postgres for the synthetic B2B SaaS telemetry generator and the dwh-dbt warehouse that reads
# it. Separate from docker-compose.yml in this repo, which serves the market-data tooling:
# that one tracks `postgres:latest`, and a `latest` tag against a persistent volume pins you to
# whatever major version initialised it. Postgres silently refuses to start after a major
# version bump, with an error that reads like a mount problem rather than a version one.
#
# This file pins the tag for that reason.
services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-saas_dw}
      POSTGRES_USER: ${WAREHOUSE_USER:-saas}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-saas}
    ports:
      # 5434 rather than 5433: the other Postgres in this repo already claims 5433.
      - "${WAREHOUSE_PORT:-5434}:5432"
    volumes:
      - saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-saas} -d ${WAREHOUSE_DB:-saas_dw}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  saas_postgres_data:
